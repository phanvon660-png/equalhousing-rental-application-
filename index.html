<script>
/* =========================================================
   RENTAL APPLICATION → NETLIFY BACKEND
   ========================================================= */

const SUBMIT_ENDPOINT = "/.netlify/functions/submit";

const form = document.getElementById("rentalApplication");
const canvas = document.getElementById("signaturePad");
const ctx = canvas.getContext("2d");
const sig = document.getElementById("signatureImage");

let drawing = false;
let hasSignature = false;


/* =========================================================
   SIGNATURE PAD
   ========================================================= */

function resizeSignatureCanvas() {

  const rect = canvas.getBoundingClientRect();

  if (!rect.width || !rect.height) return;

  const ratio =
    Math.max(window.devicePixelRatio || 1, 1);

  canvas.width =
    Math.round(rect.width * ratio);

  canvas.height =
    Math.round(rect.height * ratio);

  canvas.style.width =
    rect.width + "px";

  canvas.style.height =
    rect.height + "px";

  ctx.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0
  );

  ctx.lineWidth = 2.25;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "#123f73";
}


function getPosition(event) {

  const rect =
    canvas.getBoundingClientRect();

  return {
    x: event.clientX - rect.left,
    y: event.clientY - rect.top
  };

}


canvas.addEventListener(
  "pointerdown",
  function (event) {

    event.preventDefault();

    drawing = true;
    hasSignature = true;

    const position =
      getPosition(event);

    ctx.beginPath();

    ctx.moveTo(
      position.x,
      position.y
    );

    if (canvas.setPointerCapture) {
      canvas.setPointerCapture(
        event.pointerId
      );
    }

  }
);


canvas.addEventListener(
  "pointermove",
  function (event) {

    if (!drawing) return;

    event.preventDefault();

    const position =
      getPosition(event);

    ctx.lineTo(
      position.x,
      position.y
    );

    ctx.stroke();

  }
);


function stopDrawing() {

  if (!drawing) return;

  drawing = false;

  if (hasSignature) {

    sig.value =
      canvas.toDataURL("image/png");

  }

}


[
  "pointerup",
  "pointercancel",
  "pointerleave"
].forEach(function (eventName) {

  canvas.addEventListener(
    eventName,
    stopDrawing
  );

});


document
  .getElementById("clearSignature")
  .addEventListener(
    "click",
    function () {

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      sig.value = "";

      hasSignature = false;

    }
  );


resizeSignatureCanvas();


window.addEventListener(
  "resize",
  function () {

    if (!hasSignature) {
      resizeSignatureCanvas();
    }

  }
);


/* =========================================================
   DEFAULT DATE
   ========================================================= */

document
  .getElementById("signatureDate")
  .value =
  new Date()
    .toISOString()
    .slice(0, 10);


/* =========================================================
   STATUS MESSAGE
   ========================================================= */

function message(text, type) {

  const status =
    document.getElementById("status");

  status.textContent = text;

  status.className =
    "status show " + type;

}


/* =========================================================
   FILE → BASE64
   ========================================================= */

function fileToBase64(file) {

  return new Promise(
    function (resolve, reject) {

      if (!file) {
        resolve(null);
        return;
      }

      const reader =
        new FileReader();

      reader.onload =
        function () {

          resolve({
            name: file.name,
            type:
              file.type ||
              "application/octet-stream",
            size: file.size,
            data: reader.result
          });

        };

      reader.onerror =
        function () {

          reject(
            new Error(
              "Could not read " +
              file.name
            )
          );

        };

      reader.readAsDataURL(file);

    }
  );

}


/* =========================================================
   COLLECT FILES
   ========================================================= */

async function collectFiles() {

  const files = {};

  const inputs =
    form.querySelectorAll(
      'input[type="file"]'
    );

  for (
    const input of inputs
  ) {

    if (
      !input.files ||
      input.files.length === 0
    ) {
      continue;
    }

    const fieldName =
      input.name ||
      input.id;

    if (!fieldName) continue;

    const file =
      input.files[0];

    /*
     * Keep the existing 8 MB limit.
     */

    if (
      file.size >
      8 * 1024 * 1024
    ) {

      throw new Error(
        file.name +
        " is larger than 8 MB. Please choose a smaller file."
      );

    }

    files[fieldName] =
      await fileToBase64(file);

  }

  return files;

}


/* =========================================================
   FORM → JSON
   ========================================================= */

async function collectFormData() {

  const data = {};

  const elements =
    form.querySelectorAll(
      "input, select, textarea"
    );

  elements.forEach(
    function (element) {

      const name =
        element.name ||
        element.id;

      if (!name) return;

      /*
       * Files are collected separately.
       */

      if (
        element.type === "file"
      ) {
        return;
      }

      /*
       * Checkbox
       */

      if (
        element.type === "checkbox"
      ) {

        data[name] =
          element.checked;

        return;

      }

      /*
       * Radio
       */

      if (
        element.type === "radio"
      ) {

        if (element.checked) {

          data[name] =
            element.value;

        }

        return;

      }

      /*
       * Normal fields
       */

      data[name] =
        element.value;

    }
  );

  data.files =
    await collectFiles();

  data.applicationType =
    "rental";

  data.submittedAt =
    new Date().toISOString();

  return data;

}


/* =========================================================
   SUBMIT TO NETLIFY FUNCTION
   ========================================================= */

async function submitApplication(data) {

  const response =
    await fetch(
      SUBMIT_ENDPOINT,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json",

          "Accept":
            "application/json"
        },

        body:
          JSON.stringify(data)
      }
    );

  const responseText =
    await response.text();

  let result = {};

  if (responseText) {

    try {

      result =
        JSON.parse(
          responseText
        );

    } catch (error) {

      if (!response.ok) {

        throw new Error(
          "Server error (" +
          response.status +
          "): " +
          responseText.substring(
            0,
            300
          )
        );

      }

      throw new Error(
        "The server returned an invalid response."
      );

    }

  }

  if (
    !response.ok ||
    result.success === false
  ) {

    throw new Error(
      result.message ||
      "The application could not be submitted."
    );

  }

  return result;

}


/* =========================================================
   SUBMIT FORM
   ========================================================= */

form.addEventListener(
  "submit",
  async function (event) {

    event.preventDefault();

    /*
     * Browser validation should happen first.
     */

    if (!form.checkValidity()) {

      form.reportValidity();

      return;

    }

    /*
     * Signature validation.
     */

    if (
      !hasSignature ||
      !sig.value
    ) {

      message(
        "Please draw your signature before submitting.",
        "error"
      );

      return;

    }

    const button =
      document.getElementById(
        "submitButton"
      );

    button.disabled = true;

    button.textContent =
      "Submitting…";

    message(
      "Submitting your application securely…",
      "ok"
    );

    try {

      /*
       * Collect all application information.
       */

      const data =
        await collectFormData();

      /*
       * Send everything to the
       * existing Netlify function.
       */

      const result =
        await submitApplication(
          data
        );

      /*
       * Save application number if
       * the backend provides one.
       */

      if (
        result &&
        result.applicationId
      ) {

        localStorage.setItem(
          "lastApplicationId",
          result.applicationId
        );

      }

      /*
       * Show success panel.
       */

      document
        .getElementById(
          "successPanel"
        )
        .classList
        .add("show");

      if (
        result &&
        result.applicationId
      ) {

        document
          .querySelector(
            "#successPanel p"
          )
          .textContent =
          "Your application has been received. Application number: " +
          result.applicationId +
          ". Any separate holding deposit or payment should only be made through an authorized, secure payment page.";

      }

      message(
        "Application submitted successfully.",
        "ok"
      );

      /*
       * Clear the form after successful
       * submission.
       */

      form.reset();

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      sig.value = "";

      hasSignature = false;

      /*
       * Restore today's date.
       */

      document
        .getElementById(
          "signatureDate"
        )
        .value =
        new Date()
          .toISOString()
          .slice(0, 10);

      /*
       * Scroll to confirmation.
       */

      document
        .getElementById(
          "successPanel"
        )
        .scrollIntoView({
          behavior: "smooth",
          block: "center"
        });

    }

    catch (error) {

      console.error(
        "Application submission error:",
        error
      );

      message(
        error.message ||
        "There was a problem submitting the application. Please try again.",
        "error"
      );

    }

    finally {

      button.disabled = false;

      button.textContent =
        "Submit Rental Application";

    }

  }
);

</script>
