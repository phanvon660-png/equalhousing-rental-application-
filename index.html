<script>
const SUBMIT_URL = "/.netlify/functions/submit";
const SECURE_PAYMENT_URL = "";

document.addEventListener("DOMContentLoaded", function () {

  /* =========================
     PORTAL SWITCHING
  ========================= */

  const portalButtons = document.querySelectorAll("[data-portal]");
  const portals = document.querySelectorAll("[data-portal-content]");

  portalButtons.forEach(function (button) {
    button.addEventListener("click", function () {
      const target = button.getAttribute("data-portal");

      portalButtons.forEach(function (btn) {
        btn.classList.toggle(
          "active",
          btn.getAttribute("data-portal") === target
        );
      });

      portals.forEach(function (portal) {
        portal.style.display =
          portal.getAttribute("data-portal-content") === target
            ? ""
            : "none";
      });

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });
  });


  /* =========================
     SIGNATURE PAD
  ========================= */

  function setupSignaturePad(canvasId, hiddenInputId) {

    const canvas = document.getElementById(canvasId);
    const hiddenInput = document.getElementById(hiddenInputId);

    if (!canvas) return;

    const ctx = canvas.getContext("2d");

    let drawing = false;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();

      if (!rect.width || !rect.height) return;

      const oldImage = canvas.width && canvas.height
        ? canvas.toDataURL()
        : null;

      const ratio = window.devicePixelRatio || 1;

      canvas.width = rect.width * ratio;
      canvas.height = rect.height * ratio;

      ctx.scale(ratio, ratio);

      ctx.lineWidth = 2;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#071426";

      if (oldImage) {
        const image = new Image();

        image.onload = function () {
          ctx.drawImage(
            image,
            0,
            0,
            rect.width,
            rect.height
          );
        };

        image.src = oldImage;
      }
    }

    resizeCanvas();

    window.addEventListener("resize", resizeCanvas);

    function getPosition(event) {

      const rect = canvas.getBoundingClientRect();

      if (event.touches && event.touches.length) {
        return {
          x: event.touches[0].clientX - rect.left,
          y: event.touches[0].clientY - rect.top
        };
      }

      return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
      };
    }

    function startDrawing(event) {
      event.preventDefault();

      drawing = true;

      const pos = getPosition(event);

      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function draw(event) {

      if (!drawing) return;

      event.preventDefault();

      const pos = getPosition(event);

      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDrawing(event) {

      if (!drawing) return;

      event.preventDefault();

      drawing = false;

      if (hiddenInput) {
        hiddenInput.value = canvas.toDataURL("image/png");
      }
    }

    canvas.addEventListener("mousedown", startDrawing);
    canvas.addEventListener("mousemove", draw);
    canvas.addEventListener("mouseup", stopDrawing);
    canvas.addEventListener("mouseleave", stopDrawing);

    canvas.addEventListener("touchstart", startDrawing, {
      passive: false
    });

    canvas.addEventListener("touchmove", draw, {
      passive: false
    });

    canvas.addEventListener("touchend", stopDrawing, {
      passive: false
    });

    canvas.addEventListener("touchcancel", stopDrawing, {
      passive: false
    });

    canvas.addEventListener("click", function () {
      if (hiddenInput) {
        hiddenInput.value = canvas.toDataURL("image/png");
      }
    });
  }


  setupSignaturePad(
    "rentalSignature",
    "rentalSignatureImage"
  );

  setupSignaturePad(
    "cleanerSignature",
    "cleanerSignatureImage"
  );

  setupSignaturePad(
    "handymanSignature",
    "handymanSignatureImage"
  );


  /* =========================
     FILE TO BASE64
  ========================= */

  function fileToBase64(file) {

    return new Promise(function (resolve, reject) {

      if (!file) {
        resolve(null);
        return;
      }

      const reader = new FileReader();

      reader.onload = function () {
        resolve({
          name: file.name,
          type: file.type,
          size: file.size,
          data: reader.result
        });
      };

      reader.onerror = function () {
        reject(new Error("Could not read file."));
      };

      reader.readAsDataURL(file);
    });
  }


  async function collectFiles(form) {

    const files = {};

    const inputs = form.querySelectorAll(
      'input[type="file"]'
    );

    for (const input of inputs) {

      if (!input.files || !input.files.length) {
        continue;
      }

      const fieldName = input.name || input.id;

      if (!fieldName) continue;

      if (input.multiple) {

        files[fieldName] = [];

        for (const file of input.files) {

          /*
           * Limit individual upload size.
           * This helps prevent very large submissions.
           */

          if (file.size > 8 * 1024 * 1024) {
            throw new Error(
              file.name +
              " is larger than 8 MB. Please choose a smaller file."
            );
          }

          files[fieldName].push(
            await fileToBase64(file)
          );
        }

      } else {

        const file = input.files[0];

        if (file.size > 8 * 1024 * 1024) {
          throw new Error(
            file.name +
            " is larger than 8 MB. Please choose a smaller file."
          );
        }

        files[fieldName] =
          await fileToBase64(file);
      }
    }

    return files;
  }


  /* =========================
     FORM DATA
  ========================= */

  async function formToJSON(form) {

    const data = {};

    const elements = form.querySelectorAll(
      "input, select, textarea"
    );

    elements.forEach(function (element) {

      const name = element.name || element.id;

      if (!name) return;

      if (element.type === "file") {
        return;
      }

      if (element.type === "checkbox") {

        data[name] = element.checked;

        return;
      }

      if (element.type === "radio") {

        if (element.checked) {
          data[name] = element.value;
        }

        return;
      }

      data[name] = element.value;
    });

    data.files = await collectFiles(form);

    return data;
  }


  /* =========================
     APPLICATION TYPE
  ========================= */

  function getApplicationType(form) {

    const typeInput =
      form.querySelector(
        '[name="applicationType"]'
      );

    if (typeInput && typeInput.value) {
      return typeInput.value;
    }

    const id = form.id || "";

    if (id.toLowerCase().includes("cleaner")) {
      return "cleaner";
    }

    if (id.toLowerCase().includes("handyman")) {
      return "handyman";
    }

    return "rental";
  }


  /* =========================
     BUTTON LOADING
  ========================= */

  function setButtonLoading(button, loading) {

    if (!button) return;

    if (loading) {

      button.dataset.originalText =
        button.innerHTML;

      button.disabled = true;

      button.innerHTML =
        "Submitting…";

    } else {

      button.disabled = false;

      if (button.dataset.originalText) {
        button.innerHTML =
          button.dataset.originalText;
      }
    }
  }


  /* =========================
     SUCCESS MESSAGE
  ========================= */

  function showSuccess(form, result) {

    let panel =
      form.querySelector(
        ".application-success"
      );

    if (!panel) {

      panel = document.createElement("div");

      panel.className =
        "application-success";

      panel.style.cssText = `
        margin:24px 0;
        padding:24px;
        border-radius:16px;
        background:#eaf5fa;
        border:1px solid #48b8f5;
        color:#071426;
        font-family:inherit;
      `;

      form.parentNode.insertBefore(
        panel,
        form
      );
    }

    const applicationId =
      result.applicationId || "Received";

    panel.innerHTML = `
      <h3 style="margin-top:0;">
        Application Submitted Successfully
      </h3>

      <p>
        Thank you. Your application has been received.
      </p>

      <p>
        <strong>Application Number:</strong>
        ${applicationId}
      </p>

      <p>
        Please save this application number
        for your records.
      </p>
    `;

    panel.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });
  }


  /* =========================
     ERROR MESSAGE
  ========================= */

  function showError(form, message) {

    let panel =
      form.querySelector(
        ".application-error"
      );

    if (!panel) {

      panel = document.createElement("div");

      panel.className =
        "application-error";

      panel.style.cssText = `
        margin:24px 0;
        padding:20px;
        border-radius:16px;
        background:#fff1f1;
        border:1px solid #d9534f;
        color:#721c24;
        font-family:inherit;
      `;

      form.parentNode.insertBefore(
        panel,
        form
      );
    }

    panel.innerHTML = `
      <strong>Submission problem</strong>
      <p style="margin-bottom:0;">
        ${message}
      </p>
    `;

    panel.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });
  }


  /* =========================
     SUBMIT FORMS
  ========================= */

  const forms =
    document.querySelectorAll("form");

  forms.forEach(function (form) {

    form.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();
        event.stopPropagation();

        const submitButton =
          form.querySelector(
            'button[type="submit"], input[type="submit"]'
          );

        setButtonLoading(
          submitButton,
          true
        );

        try {

          const data =
            await formToJSON(form);

          data.applicationType =
            getApplicationType(form);

          data.submittedAt =
            new Date().toISOString();

          /*
           * Basic signature requirement.
           */

          const signature =
            data.signatureName;

          if (
            form.id.toLowerCase().includes("rental") &&
            (!signature ||
             signature.trim() === "")
          ) {

            throw new Error(
              "Please enter your signature name."
            );
          }

          const response =
            await fetch(
              SUBMIT_URL,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify(data)
              }
            );

          let result = {};

          try {
            result =
              await response.json();
          } catch (e) {
            result = {};
          }

          if (
            !response.ok ||
            result.success === false
          ) {

            throw new Error(
              result.message ||
              "The application could not be submitted."
            );
          }

          if (result.applicationId) {

            localStorage.setItem(
              "lastApplicationId",
              result.applicationId
            );
          }

          showSuccess(
            form,
            result
          );

          /*
           * Keep the form on the page.
           * Do not reload the page.
           */

        } catch (error) {

          console.error(
            "Submission error:",
            error
          );

          showError(
            form,
            error.message ||
            "Something went wrong. Please try again."
          );

        } finally {

          setButtonLoading(
            submitButton,
            false
          );
        }
      }
    );
  });


  /* =========================
     PAYMENT PAGE BUTTON
  ========================= */

  const paymentButtons =
    document.querySelectorAll(
      "[data-payment-button]"
    );

  paymentButtons.forEach(function (button) {

    button.addEventListener(
      "click",
      function () {

        if (!SECURE_PAYMENT_URL) {

          alert(
            "The secure payment page has not been connected yet."
          );

          return;
        }

        window.location.href =
          SECURE_PAYMENT_URL;
      }
    );
  });


  /* =========================
     DEPOSIT RECEIPT
  ========================= */

  const receiptForms =
    document.querySelectorAll(
      '[data-form-type="deposit-receipt"]'
    );

  receiptForms.forEach(function (form) {

    form.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();

        const button =
          form.querySelector(
            'button[type="submit"], input[type="submit"]'
          );

        setButtonLoading(
          button,
          true
        );

        try {

          const data =
            await formToJSON(form);

          data.applicationType =
            "deposit_receipt";

          data.submittedAt =
            new Date().toISOString();

          const response =
            await fetch(
              SUBMIT_URL,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify(data)
              }
            );

          const result =
            await response.json();

          if (
            !response.ok ||
            result.success === false
          ) {

            throw new Error(
              result.message ||
              "Receipt could not be submitted."
            );
          }

          showSuccess(
            form,
            result
          );

        } catch (error) {

          showError(
            form,
            error.message ||
            "Receipt submission failed."
          );

        } finally {

          setButtonLoading(
            button,
            false
          );
        }
      }
    );
  });


  /* =========================
     REMEMBER LAST APPLICATION
  ========================= */

  const savedApplicationId =
    localStorage.getItem(
      "lastApplicationId"
    );

  if (savedApplicationId) {

    console.log(
      "Last application:",
      savedApplicationId
    );
  }

});
</script>

</body>
</html>
