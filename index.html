<script>
/* =========================================================
   APPLICATION SYSTEM
   ========================================================= */

const SUBMIT_URL = "/.netlify/functions/submit";

/*
 * Add your secure payment URL here when you have one.
 * Example:
 * const SECURE_PAYMENT_URL = "https://example.com/payment";
 */
const SECURE_PAYMENT_URL = "";


document.addEventListener("DOMContentLoaded", function () {

  /* =======================================================
     PORTAL SWITCHING
     ======================================================= */

  const portalButtons =
    document.querySelectorAll("[data-portal]");

  const portals =
    document.querySelectorAll("[data-portal-content]");

  portalButtons.forEach(function (button) {

    button.addEventListener("click", function () {

      const target =
        button.getAttribute("data-portal");

      portalButtons.forEach(function (btn) {

        btn.classList.toggle(
          "active",
          btn.getAttribute("data-portal") === target
        );

      });

      portals.forEach(function (portal) {

        const content =
          portal.getAttribute("data-portal-content");

        portal.style.display =
          content === target ? "" : "none";

      });

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    });

  });


  /* =======================================================
     SIGNATURE PAD
     ======================================================= */

  function setupSignaturePad(canvasId, hiddenInputId) {

    const canvas =
      document.getElementById(canvasId);

    const hiddenInput =
      document.getElementById(hiddenInputId);

    if (!canvas) {
      return;
    }

    const ctx =
      canvas.getContext("2d");

    if (!ctx) {
      return;
    }

    let drawing = false;
    let hasSignature = false;


    function resizeCanvas() {

      const rect =
        canvas.getBoundingClientRect();

      if (!rect.width || !rect.height) {
        return;
      }

      const oldWidth = canvas.width;
      const oldHeight = canvas.height;

      let oldImage = null;

      if (oldWidth && oldHeight && hasSignature) {
        try {
          oldImage = canvas.toDataURL("image/png");
        } catch (error) {
          oldImage = null;
        }
      }

      const ratio =
        Math.max(window.devicePixelRatio || 1, 1);

      canvas.width =
        Math.round(rect.width * ratio);

      canvas.height =
        Math.round(rect.height * ratio);

      canvas.style.width =
        rect.width + "px";

      canvas.style.height =
        rect.height + "px";

      /*
       * Reset transform before applying the new scale.
       * This prevents the scale from multiplying every
       * time the window is resized.
       */

      ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
      );

      ctx.lineWidth = 2;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#071426";

      if (oldImage) {

        const image =
          new Image();

        image.onload = function () {

          ctx.drawImage(
            image,
            0,
            0,
            rect.width,
            rect.height
          );

        };

        image.src = oldImage;
      }

    }


    function getPosition(event) {

      const rect =
        canvas.getBoundingClientRect();

      let clientX;
      let clientY;

      if (
        event.touches &&
        event.touches.length > 0
      ) {

        clientX =
          event.touches[0].clientX;

        clientY =
          event.touches[0].clientY;

      } else {

        clientX =
          event.clientX;

        clientY =
          event.clientY;

      }

      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };

    }


    function startDrawing(event) {

      event.preventDefault();

      drawing = true;

      hasSignature = true;

      const position =
        getPosition(event);

      ctx.beginPath();

      ctx.moveTo(
        position.x,
        position.y
      );

    }


    function draw(event) {

      if (!drawing) {
        return;
      }

      event.preventDefault();

      const position =
        getPosition(event);

      ctx.lineTo(
        position.x,
        position.y
      );

      ctx.stroke();

    }


    function saveSignature() {

      if (!hiddenInput) {
        return;
      }

      if (!hasSignature) {
        hiddenInput.value = "";
        return;
      }

      try {

        hiddenInput.value =
          canvas.toDataURL("image/png");

      } catch (error) {

        console.error(
          "Could not save signature:",
          error
        );

      }

    }


    function stopDrawing(event) {

      if (!drawing) {
        return;
      }

      if (event) {
        event.preventDefault();
      }

      drawing = false;

      saveSignature();

    }


    /*
     * Mouse
     */

    canvas.addEventListener(
      "mousedown",
      startDrawing
    );

    canvas.addEventListener(
      "mousemove",
      draw
    );

    canvas.addEventListener(
      "mouseup",
      stopDrawing
    );

    canvas.addEventListener(
      "mouseleave",
      stopDrawing
    );


    /*
     * Touch
     */

    canvas.addEventListener(
      "touchstart",
      startDrawing,
      { passive: false }
    );

    canvas.addEventListener(
      "touchmove",
      draw,
      { passive: false }
    );

    canvas.addEventListener(
      "touchend",
      stopDrawing,
      { passive: false }
    );

    canvas.addEventListener(
      "touchcancel",
      stopDrawing,
      { passive: false }
    );


    /*
     * Initial sizing
     */

    resizeCanvas();


    /*
     * Resize without multiplying the canvas scale.
     */

    window.addEventListener(
      "resize",
      resizeCanvas
    );


    /*
     * Save signature if canvas changes.
     */

    canvas.addEventListener(
      "click",
      saveSignature
    );

  }


  setupSignaturePad(
    "rentalSignature",
    "rentalSignatureImage"
  );

  setupSignaturePad(
    "cleanerSignature",
    "cleanerSignatureImage"
  );

  setupSignaturePad(
    "handymanSignature",
    "handymanSignatureImage"
  );


  /* =======================================================
     FILE → BASE64
     ======================================================= */

  function fileToBase64(file) {

    return new Promise(function (resolve, reject) {

      if (!file) {
        resolve(null);
        return;
      }

      const reader =
        new FileReader();

      reader.onload = function () {

        resolve({
          name: file.name,
          type: file.type || "application/octet-stream",
          size: file.size,
          data: reader.result
        });

      };

      reader.onerror = function () {

        reject(
          new Error(
            "Could not read file: " +
            file.name
          )
        );

      };

      reader.readAsDataURL(file);

    });

  }


  /* =======================================================
     COLLECT FILES
     ======================================================= */

  async function collectFiles(form) {

    const files = {};

    const inputs =
      form.querySelectorAll(
        'input[type="file"]'
      );


    for (const input of inputs) {

      if (
        !input.files ||
        input.files.length === 0
      ) {
        continue;
      }


      const fieldName =
        input.name ||
        input.id;


      if (!fieldName) {
        continue;
      }


      /*
       * Multiple files
       */

      if (input.multiple) {

        files[fieldName] = [];


        for (
          const file of input.files
        ) {

          if (
            file.size >
            8 * 1024 * 1024
          ) {

            throw new Error(
              file.name +
              " is larger than 8 MB. Please choose a smaller file."
            );

          }


          const encoded =
            await fileToBase64(file);

          files[fieldName].push(
            encoded
          );

        }

      }


      /*
       * Single file
       */

      else {

        const file =
          input.files[0];


        if (
          file.size >
          8 * 1024 * 1024
        ) {

          throw new Error(
            file.name +
            " is larger than 8 MB. Please choose a smaller file."
          );

        }


        files[fieldName] =
          await fileToBase64(file);

      }

    }


    return files;

  }


  /* =======================================================
     FORM → JSON
     ======================================================= */

  async function formToJSON(form) {

    const data = {};

    const elements =
      form.querySelectorAll(
        "input, select, textarea"
      );


    elements.forEach(function (element) {

      const name =
        element.name ||
        element.id;


      if (!name) {
        return;
      }


      /*
       * Files are handled separately.
       */

      if (
        element.type === "file"
      ) {
        return;
      }


      /*
       * Checkbox
       */

      if (
        element.type === "checkbox"
      ) {

        data[name] =
          element.checked;

        return;
      }


      /*
       * Radio
       */

      if (
        element.type === "radio"
      ) {

        if (element.checked) {

          data[name] =
            element.value;

        }

        return;
      }


      /*
       * Normal input/select/textarea
       */

      data[name] =
        element.value;

    });


    data.files =
      await collectFiles(form);


    return data;

  }


  /* =======================================================
     APPLICATION TYPE
     ======================================================= */

  function getApplicationType(form) {

    const typeInput =
      form.querySelector(
        '[name="applicationType"]'
      );


    if (
      typeInput &&
      typeInput.value
    ) {

      return typeInput.value;

    }


    const formId =
      (
        form.id ||
        ""
      ).toLowerCase();


    if (
      formId.includes("cleaner")
    ) {

      return "cleaner";

    }


    if (
      formId.includes("handyman")
    ) {

      return "handyman";

    }


    if (
      formId.includes("deposit") ||
      form.hasAttribute(
        "data-form-type"
      )
    ) {

      const formType =
        form.getAttribute(
          "data-form-type"
        );

      if (
        formType ===
        "deposit-receipt"
      ) {

        return "deposit_receipt";

      }

    }


    return "rental";

  }


  /* =======================================================
     BUTTON LOADING
     ======================================================= */

  function setButtonLoading(
    button,
    loading
  ) {

    if (!button) {
      return;
    }


    if (loading) {

      if (
        !button.dataset.originalText
      ) {

        button.dataset.originalText =
          button.innerHTML;

      }


      button.disabled = true;

      button.style.cursor =
        "wait";

      button.innerHTML =
        "Submitting…";

    }


    else {

      button.disabled = false;

      button.style.cursor =
        "";

      if (
        button.dataset.originalText
      ) {

        button.innerHTML =
          button.dataset.originalText;

      }

    }

  }


  /* =======================================================
     SAFE HTML
     ======================================================= */

  function escapeHTML(value) {

    return String(value || "")
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  /* =======================================================
     SUCCESS MESSAGE
     ======================================================= */

  function showSuccess(
    form,
    result
  ) {

    let panel =
      form.querySelector(
        ".application-success"
      );


    if (!panel) {

      panel =
        document.createElement(
          "div"
        );

      panel.className =
        "application-success";

      panel.style.cssText = `
        margin:24px 0;
        padding:24px;
        border-radius:16px;
        background:#eaf5fa;
        border:1px solid #48b8f5;
        color:#071426;
        font-family:inherit;
      `;

      form.parentNode.insertBefore(
        panel,
        form
      );

    }


    const applicationId =
      escapeHTML(
        result &&
        result.applicationId
          ? result.applicationId
          : "Received"
      );


    panel.innerHTML = `
      <h3 style="margin-top:0;">
        Application Submitted Successfully
      </h3>

      <p>
        Thank you. Your application has been received.
      </p>

      <p>
        <strong>Application Number:</strong>
        ${applicationId}
      </p>

      <p>
        Please save this application number
        for your records.
      </p>
    `;


    panel.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });

  }


  /* =======================================================
     ERROR MESSAGE
     ======================================================= */

  function showError(
    form,
    message
  ) {

    let panel =
      form.querySelector(
        ".application-error"
      );


    if (!panel) {

      panel =
        document.createElement(
          "div"
        );

      panel.className =
        "application-error";

      panel.style.cssText = `
        margin:24px 0;
        padding:20px;
        border-radius:16px;
        background:#fff1f1;
        border:1px solid #d9534f;
        color:#721c24;
        font-family:inherit;
      `;

      form.parentNode.insertBefore(
        panel,
        form
      );

    }


    panel.innerHTML = `
      <strong>Submission problem</strong>

      <p style="margin-bottom:0;">
        ${escapeHTML(
          message ||
          "Something went wrong. Please try again."
        )}
      </p>
    `;


    panel.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });

  }


  /* =======================================================
     SEND DATA TO SERVER
     ======================================================= */

  async function submitApplication(
    data
  ) {

    const response =
      await fetch(
        SUBMIT_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json",
            "Accept":
              "application/json"
          },

          body:
            JSON.stringify(data)
        }
      );


    /*
     * Read response as text first.
     * This prevents a JSON parsing error from
     * hiding the actual server error.
     */

    const responseText =
      await response.text();


    let result = {};


    if (responseText) {

      try {

        result =
          JSON.parse(
            responseText
          );

      } catch (error) {

        /*
         * Server returned something other than JSON.
         */

        if (!response.ok) {

          throw new Error(
            "Server error (" +
            response.status +
            "): " +
            responseText.substring(
              0,
              300
            )
          );

        }

        throw new Error(
          "The server returned an invalid response."
        );

      }

    }


    if (
      !response.ok ||
      result.success === false
    ) {

      throw new Error(
        result.message ||
        "The application could not be submitted."
      );

    }


    return result;

  }


  /* =======================================================
     NORMAL APPLICATION FORMS
     ======================================================= */

  const forms =
    document.querySelectorAll(
      "form"
    );


  forms.forEach(function (form) {

    /*
     * Deposit receipt forms are handled separately below.
     */

    if (
      form.getAttribute(
        "data-form-type"
      ) ===
      "deposit-receipt"
    ) {

      return;

    }


    form.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();
        event.stopPropagation();


        const submitButton =
          form.querySelector(
            'button[type="submit"], input[type="submit"]'
          );


        /*
         * Prevent accidental double-click submissions.
         */

        if (
          submitButton &&
          submitButton.disabled
        ) {

          return;

        }


        setButtonLoading(
          submitButton,
          true
        );


        try {

          const data =
            await formToJSON(
              form
            );


          const applicationType =
            getApplicationType(
              form
            );


          data.applicationType =
            applicationType;


          data.submittedAt =
            new Date().toISOString();


          /*
           * -------------------------------------------------
           * SIGNATURE VALIDATION
           * -------------------------------------------------
           *
           * A drawn signature is stored in:
           *
           * rentalSignatureImage
           * cleanerSignatureImage
           * handymanSignatureImage
           *
           * A typed signature can be stored in:
           *
           * signatureName
           *
           * Rental applications require at least one.
           */


          if (
            applicationType ===
            "rental"
          ) {

            const typedSignature =
              String(
                data.signatureName ||
                ""
              ).trim();


            const drawnSignature =
              String(
                data.rentalSignatureImage ||
                ""
              ).trim();


            if (
              !typedSignature &&
              !drawnSignature
            ) {

              throw new Error(
                "Please enter your signature name or sign in the signature box."
              );

            }

          }


          /*
           * Submit to backend.
           */

          const result =
            await submitApplication(
              data
            );


          /*
           * Save application number.
           */

          if (
            result &&
            result.applicationId
          ) {

            localStorage.setItem(
              "lastApplicationId",
              result.applicationId
            );

          }


          /*
           * Display success.
           */

          showSuccess(
            form,
            result
          );


          /*
           * Do not reload or reset the form.
           */

        }


        catch (error) {

          console.error(
            "Application submission error:",
            error
          );


          showError(
            form,
            error.message ||
            "Something went wrong. Please try again."
          );

        }


        finally {

          setButtonLoading(
            submitButton,
            false
          );

        }

      }
    );

  });


  /* =======================================================
     PAYMENT BUTTONS
     ======================================================= */

  const paymentButtons =
    document.querySelectorAll(
      "[data-payment-button]"
    );


  paymentButtons.forEach(
    function (button) {

      button.addEventListener(
        "click",
        function () {

          if (
            !SECURE_PAYMENT_URL
          ) {

            alert(
              "The secure payment page has not been connected yet."
            );

            return;

          }


          window.location.href =
            SECURE_PAYMENT_URL;

        }
      );

    }
  );


  /* =======================================================
     DEPOSIT RECEIPT FORMS
     ======================================================= */

  const receiptForms =
    document.querySelectorAll(
      '[data-form-type="deposit-receipt"]'
    );


  receiptForms.forEach(
    function (form) {

      form.addEventListener(
        "submit",
        async function (event) {

          event.preventDefault();
          event.stopPropagation();


          const button =
            form.querySelector(
              'button[type="submit"], input[type="submit"]'
            );


          if (
            button &&
            button.disabled
          ) {

            return;

          }


          setButtonLoading(
            button,
            true
          );


          try {

            const data =
              await formToJSON(
                form
              );


            data.applicationType =
              "deposit_receipt";


            data.submittedAt =
              new Date().toISOString();


            const result =
              await submitApplication(
                data
              );


            if (
              result &&
              result.applicationId
            ) {

              localStorage.setItem(
                "lastApplicationId",
                result.applicationId
              );

            }


            showSuccess(
              form,
              result
            );

          }


          catch (error) {

            console.error(
              "Receipt submission error:",
              error
            );


            showError(
              form,
              error.message ||
              "Receipt submission failed."
            );

          }


          finally {

            setButtonLoading(
              button,
              false
            );

          }

        }
      );

    }
  );


  /* =======================================================
     REMEMBER LAST APPLICATION
     ======================================================= */

  const savedApplicationId =
    localStorage.getItem(
      "lastApplicationId"
    );


  if (savedApplicationId) {

    console.log(
      "Last application:",
      savedApplicationId
    );

  }


  /* =======================================================
     SYSTEM READY
     ======================================================= */

  console.log(
    "Application system initialized."
  );

});
</script>
